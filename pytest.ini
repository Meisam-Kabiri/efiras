[pytest]
# Pytest configuration for EFIRAS backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=5

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external services
    unit: marks tests as unit tests (fast, no external dependencies)

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    model_cache
    data
    logs
    temps

# Ignore specific test files (old experimental files)
collect_ignore =
    tests/test_fitz.py
    tests/test_training.py
    tests/custom_table_detector.py
    tests/detect_table.py
    tests/fitz_analysis.py
    tests/read_page_auzre.py
    tests/read_table_azure.py

# Coverage options
[coverage:run]
source = app,core
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*
    */build/*
    */dist/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
